<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Žďáráci – Přihlášení</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="container">
    <h1>Žďáráci – Recenzní systém (MVP)</h1>
    <p class="muted small">
      Sprint 1: přihlášení a směrování do rolí (žádné nahrávání, žádná DB).
    </p>
  </header>

  <main class="container">
    <section class="card" style="max-width:560px;">
      <h2>Přihlášení</h2>
      <form id="loginForm" novalidate>
        <div class="grid">
          <label>
            Uživatel
            <input id="username" type="text"
                   placeholder="autor / redaktor / recenzent / sefredaktor / ctenar / admin"
                   required />
          </label>
          <label>
            Heslo
            <input id="password" type="password" placeholder="heslo" required />
          </label>
        </div>
        <div class="actions">
          <button type="submit">Přihlásit</button>
          <span id="loginErr" class="error"></span>
        </div>
      </form>
    </section>
  </main>

  <footer class="container muted small">
    Tip: pokud se styly nenačtou, otevři projekt přes Live Server (kvůli relativním cestám).
  </footer>

  <script type="module" src="./src/js/login.js"></script>
</body>
</html>
